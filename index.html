<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>randhir foundation</title>
    
<style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: #e4e1e1;
}

.navbar{
    background-color: rgba(0, 0, 0, 0.6);
    color: white;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}

 .logo{
    font-size: 1.5rem;
    font-weight: bold;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    cursor: pointer;
}

.navbar nav{
    flex: 1;
    margin-left: 50px;
}

.navbar ul{
    display: flex;
    list-style: none;
    text-align: center;
    gap: 30px;
}

.navbar ul li{
    position: relative;
}

.navbar ul li a{
    text-decoration: none;
    color: white;
    padding: 8px 15px;
    border-radius: 5px;
    transition: 0.3s ease, border-radius 0.3s ease;
}

.navbar ul li a:hover{
    background-color: #01010192;
}

.dropdown-content{
    display: none;
    position: absolute;
    top: 25px;
    left: 0;
    background: rgba(2, 250, 254, 0.519);
    color: white;
    min-width: 200px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    border-radius: 5px;
    overflow: hidden;
    z-index: 1000;
}

.dropdown-content a{
    display: block;
    padding: 10px 15px;
    text-decoration: none;
    color: white;
    transition: background-color 0.3s ease;
}

.dropdown-content a:hover{
    background-color: #00000057;
}

.dropdown:hover .dropdown-content{
    display: block;
    animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn{
    from{
        opacity: 0;
        transform: translateY(-10px);
    }
    to{
        opacity: 1;
        transform: translateY(0);
    }
}

.search{
    position: relative;
}

.search input{
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    outline: none;
    width: 200px;
}

@media screen and (max-width: 768px){
    .navbar{
        flex-direction: column;
        padding-top: 10px;
    }

    .navbar nav{
        width: 100%;
        margin: 20px 0;
    }

    .navbar ul{
        flex-direction: column;
        justify-content: center;
    }

    .search{
        width: 100%;
        display: flex;
        justify-content: center;
    }

    .search input{
        width: 70%;
    }
}
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">RANDHIR FOUNDATION</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Contact</a></li>
                <li class="dropdown"><a href="#">Course</a>
                <div class="dropdown-content">
                    <a href="#">Web Development</a>
                    <a href="#">Class 11 Biology</a>
                    <a href="#">Class 12 Biology</a>
                </div>
            </li>
            <li><a href="#">Donation</a></li>
            </ul>
        </nav>

        <div class="search">
            <input type="text" placeholder="Search...">
        </div>
    </header>
</body>
</html>
